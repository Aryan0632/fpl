name: Refresh FPL data

on:
  schedule:
    # Every 15 minutes, offset from the exact quarter-hour to dodge GitHub's
    # top-of-hour/quarter-hour congestion (schedules can be delayed under high load).
    # The script itself decides whether to actually do the heavy work or exit
    # immediately, so this being frequent doesn't mean 150+ API calls every 15 min.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the bot can push the updated index.html back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch fresh FPL data and patch index.html
        run: python refresh_data.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "fpl-refresh-bot"
          git config user.email "fpl-refresh-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
